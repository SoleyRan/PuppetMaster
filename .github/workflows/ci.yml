name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} (default)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: ubuntu-latest (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: asan-ubsan
            flags: -fsanitize=address,undefined -fno-sanitize-recover=undefined -g
          - sanitizer: tsan
            flags: -fsanitize=thread -g -O1
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPUPPETMASTER_BUILD_DEMOS=OFF \
            "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"

      - name: Build
        run: cmake --build build --parallel

      # setarch -R disables ASLR for ctest and its children: ThreadSanitizer
      # aborts on the high-entropy mmap layout of current Ubuntu kernels.
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure

  json-config:
    name: ubuntu-latest (JSON configuration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JSON dependency
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev

      - name: Configure
        run: cmake -S . -B build-json -DCMAKE_BUILD_TYPE=Release -DPUPPETMASTER_ENABLE_JSON_CONFIG=ON

      - name: Build
        run: cmake --build build-json --parallel

      - name: Test
        run: ctest --test-dir build-json --output-on-failure

      - name: Install and verify downstream consumer
        run: |
          set -e
          cmake --install build-json --prefix "$GITHUB_WORKSPACE/json-install"
          mkdir -p consumer-json
          cat > consumer-json/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(PuppetMasterJsonConsumer LANGUAGES CXX)
          find_package(PuppetMaster CONFIG REQUIRED)
          add_executable(json_consumer main.cpp)
          target_link_libraries(json_consumer PRIVATE PuppetMaster::JsonConfigAdapter)
          EOF
          printf '#include <puppet_master/configuration/json_loader.h>\nint main() { auto config = puppet_master::configuration::ParseJsonConfig("{}"); return config.ok() ? 0 : 1; }\n' > consumer-json/main.cpp
          cmake -S consumer-json -B consumer-json/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/json-install"
          cmake --build consumer-json/build --parallel
          consumer-json/build/json_consumer

      - name: Validate example configuration with the installed tool
        run: |
          "$GITHUB_WORKSPACE/json-install/bin/puppet_master_config" validate demo/config/speed_pipeline.json
          "$GITHUB_WORKSPACE/json-install/bin/puppet_master_config" describe demo/config/speed_pipeline.json

      # Interface and node packages built separately against the install, as
      # separate teams would, then the multi-process run and a version skew.
      - name: Build and run the vehicle pipeline example
        run: |
          set -e
          integration=examples/vehicle_pipeline/integration
          config_tool="$GITHUB_WORKSPACE/json-install/bin/puppet_master_config"
          "$integration/build_all.sh" "$GITHUB_WORKSPACE/json-install" "$GITHUB_WORKSPACE/vehicle"
          timeout 60s "$integration/run_pipeline.sh" "$GITHUB_WORKSPACE/vehicle" "$config_tool" 3
          timeout 300s "$integration/check_version_skew.sh" "$GITHUB_WORKSPACE/json-install" \
            "$GITHUB_WORKSPACE/skew" "$config_tool"

  fastdds:
    name: ubuntu-latest (FastDDS ${{ matrix.fastdds }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fastdds: v2.14.4
            fastcdr: v2.2.5
          - fastdds: v3.2.2
            fastcdr: v2.3.3
    env:
      DEPS_PREFIX: ${{ github.workspace }}/deps-install
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libasio-dev libtinyxml2-dev libssl-dev ninja-build

      - name: Cache FastDDS
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: fastdds-${{ runner.os }}-${{ matrix.fastdds }}-${{ matrix.fastcdr }}-v1

      - name: Build FastDDS from source
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p deps-src && cd deps-src

          git clone --depth 1 https://github.com/eProsima/foonathan_memory_vendor.git
          cmake -S foonathan_memory_vendor -B build-foonathan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" -DBUILD_SHARED_LIBS=ON
          cmake --build build-foonathan --target install

          git clone --depth 1 --branch ${{ matrix.fastcdr }} https://github.com/eProsima/Fast-CDR.git
          cmake -S Fast-CDR -B build-fastcdr -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX"
          cmake --build build-fastcdr --target install

          git clone --depth 1 --branch ${{ matrix.fastdds }} https://github.com/eProsima/Fast-DDS.git
          cmake -S Fast-DDS -B build-fastdds -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DCMAKE_PREFIX_PATH="$DEPS_PREFIX" -DCOMPILE_EXAMPLES=OFF -DBUILD_TESTING=OFF
          cmake --build build-fastdds --target install

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPUPPETMASTER_ENABLE_FASTDDS=ON \
            -DPUPPETMASTER_BUILD_FASTDDS_CROSS_PROCESS_SMOKE=ON \
            -DCMAKE_PREFIX_PATH="$DEPS_PREFIX"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          LD_LIBRARY_PATH: ${{ env.DEPS_PREFIX }}/lib
        run: ctest --test-dir build --output-on-failure

      - name: Diagnose FastDDS transport crash
        if: failure() && matrix.fastdds == 'v3.2.2'
        env:
          LD_LIBRARY_PATH: ${{ env.DEPS_PREFIX }}/lib
        run: |
          sudo apt-get install -y gdb
          gdb -batch -ex run -ex 'thread apply all bt' --args build/test/puppet_master_fastdds_transport_test

      - name: Cross-process UDP smoke
        env:
          LD_LIBRARY_PATH: ${{ env.DEPS_PREFIX }}/lib
        run: timeout 45s build/test/puppet_master_fastdds_cross_process_smoke

      - name: Install and verify downstream consumer
        env:
          LD_LIBRARY_PATH: ${{ env.DEPS_PREFIX }}/lib
        run: |
          set -e
          cmake --install build --prefix "$DEPS_PREFIX/puppetmaster"
          mkdir -p consumer-check
          cat > consumer-check/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(PuppetMasterConsumer LANGUAGES CXX)
          find_package(PuppetMaster CONFIG REQUIRED)
          add_executable(puppet_master_consumer main.cpp)
          target_link_libraries(puppet_master_consumer PRIVATE PuppetMaster::FastDdsAdapter)
          EOF
          printf '#include <puppet_master/transport/fastdds/fastdds_transport.h>\nint main() { auto name = puppet_master::core::TransportName::Create("consumer"); puppet_master::transport::fastdds::FastDdsTransport transport(name.value()); return transport.Open().ok() && transport.Close().ok() ? 0 : 1; }\n' > consumer-check/main.cpp
          cmake -S consumer-check -B consumer-check/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$DEPS_PREFIX/puppetmaster;$DEPS_PREFIX"
          cmake --build consumer-check/build --parallel
          consumer-check/build/puppet_master_consumer
